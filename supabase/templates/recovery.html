<!doctype html>
<html lang="en-GB">
  <body style="font-family: Arial, sans-serif; font-size: 18px; line-height: 1.6; color: #10242b">
    <h1 style="font-size: 24px">Reset your password</h1>
    <p>We received a request to reset the password for your Medicine Review Direct account.</p>
    <p>Select the link below to choose a new password. The link expires in 1 hour.</p>
    <p>
      <a
        href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
        style="color: #0f5e63; font-weight: bold"
        >Choose a new password</a
      >
    </p>
    <p>If you did not ask to reset your password, you can ignore this email.</p>
  </body>
</html>
