<!doctype html>
<html lang="en-GB">
  <body style="font-family: Arial, sans-serif; font-size: 18px; line-height: 1.6; color: #10242b">
    <h1 style="font-size: 24px">Confirm your email address</h1>
    <p>Thank you for creating an account for a pharmacist medication review.</p>
    <p>Select the link below to confirm your email address. The link expires in 1 hour.</p>
    <p>
      <a
        href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=signup"
        style="color: #0f5e63; font-weight: bold"
        >Confirm my email address</a
      >
    </p>
    <p>If you did not create an account, you can ignore this email.</p>
  </body>
</html>
