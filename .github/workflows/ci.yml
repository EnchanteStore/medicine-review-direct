name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Local Supabase demo values; the web build needs syntactically valid config.
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key-not-a-secret
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Generated pgTAP screening cases are up to date
        run: node packages/domain/scripts/generate-screening-pgtap.mjs && git diff --exit-code supabase/tests
      - run: pnpm build

  database:
    name: Migrations and RLS tests (pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start local database and storage (applies migrations and seed)
        run: pnpm exec supabase start -x studio,imgproxy,postgres-meta,mailpit,realtime,edge-runtime,logflare,vector,supavisor
      - name: Lint database schema
        run: pnpm exec supabase db lint --level warning --fail-on error
      - name: Run pgTAP tests
        run: pnpm exec supabase test db

  e2e:
    name: End-to-end and accessibility (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase
        run: pnpm exec supabase start -x studio,imgproxy,postgres-meta
      - name: Write local env from Supabase status
        run: pnpm --filter @mrd/web env:local
      - name: Build web app with local Supabase config
        run: |
          set -a; . apps/web/.env.local; set +a
          pnpm --filter @mrd/web build
      - run: pnpm --filter @mrd/web exec playwright install --with-deps chromium
      - name: Run Playwright
        run: |
          set -a; . apps/web/.env.local; set +a
          pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
